name: Windows local tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ENABLE_LIVE_TRADING: "false"
      BSC_RPC_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Run mocked wallet and local HTTP tests
        run: npm test
